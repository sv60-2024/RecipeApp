<h1>RecipeApp</h1>

<nav aria-label="Main navigation">
  <a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">Home</a>
  <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profile</a>
  @if (auth.isAdmin()) {
    <a routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">Admin</a>
  }
</nav>

<!-- PRIVREMENO: izbor uloge dok ne postoji prijava -->
<div class="dev-role">
  <label for="dev-role">Uloga (privremeno):</label>
  <select id="dev-role" [value]="auth.role() ?? ''" (change)="changeRole($event)">
    <option value="">Gost</option>
    <option value="USER">Korisnik</option>
    <option value="ADMIN">Admin</option>
  </select>
</div>

<router-outlet></router-outlet>
