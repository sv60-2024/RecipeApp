<div class="toolbar">
  <mat-form-field appearance="outline" class="search">
    <mat-label>Pretraga</mat-label>
    <input matInput placeholder="Unesi pojam" (input)="applyFilter($event)" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- Ovde roditelj ubacuje svoja dugmad, npr. „Dodaj”. -->
  <ng-content></ng-content>
</div>

<div class="table-card">
  <table mat-table [dataSource]="dataSource" matSort>
    @for (column of columns; track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="!column.sortable">
          {{ column.header }}
        </th>
        <td mat-cell *matCellDef="let row">{{ row[column.key] }}</td>
      </ng-container>
    }

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Akcije</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" aria-label="Izmeni" (click)="edit.emit(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" aria-label="Obriši" (click)="remove.emit(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-mdc-row" *matNoDataRow>
      <td class="mat-mdc-cell no-data" [attr.colspan]="displayedColumns.length">
        @if (searchText) {
          Nema rezultata za „{{ searchText }}”.
        } @else {
          Nema podataka.
        }
      </td>
    </tr>
  </table>

  <mat-paginator
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Izbor strane"
  ></mat-paginator>
</div>
