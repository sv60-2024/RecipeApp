<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Otkaži</button>
  <button mat-flat-button type="button" class="confirm" [mat-dialog-close]="true">
    {{ data.confirmText ?? 'Potvrdi' }}
  </button>
</mat-dialog-actions>
